# Security updates are managed by GitHub Dependabot settings. No scheduled
# npm or GitHub Actions version-update PRs for this production-only app.
# Security fixes are still permitted when Dependabot security updates are enabled.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
