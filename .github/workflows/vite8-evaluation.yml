name: Evaluate Vite 8 (no deployment)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vite8-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install current locked dependencies
        run: npm ci
      - name: Baseline tests and build (Vite 7)
        run: |
          npm run test:run
          npm run build
          du -sk dist | awk '{ print "baseline build KB: " $1 }'
      - name: Test Vite 8 and compatible Vue plugin without changing manifests
        run: npm install --no-save --package-lock=false --no-audit --no-fund 'vite@^8.1.0' '@vitejs/plugin-vue@^6.0.9'
      - name: Candidate tests and build (Vite 8)
        run: |
          node -e 'console.log("Vite candidate:", require("./node_modules/vite/package.json").version)'
          npm run test:run
          npm run build
          du -sk dist | awk '{ print "Vite 8 build KB: " $1 }'
      - name: Confirm manifest and lockfile remain untouched
        run: git diff --exit-code -- package.json package-lock.json vite.config.js

# This workflow only evaluates a temporary node_modules upgrade on the runner.
# No wrangler deploy, Cloudflare API, production build output, or token access.
